# Cross-site scripting (XSS) fuzzing
#
# Injects XSS payloads into HTTP parameters and checks whether the payload
# is reflected back in the response unescaped — indicating a reflected XSS
# vulnerability. Also tests for DOM injection indicators and stored XSS
# by checking if a probe token appears in subsequent GET responses.
#
# Payload categories:
#   Basic reflection      — <script>alert(1)</script> and variants
#   Attribute injection   — " onmouseover="alert(1) style injections
#   Event handler bypass  — onerror, onload, onmouseover in various contexts
#   Filter bypass         — case variation, URL encoding, HTML entity encoding,
#                           double encoding, backtick injection, SVG/MathML vectors
#   JavaScript URI        — javascript:alert(1) in href/src attributes
#   HTML5 vectors         — <video>, <audio>, <details>, <body> event handlers
#   Angular/Vue SSTI      — {{constructor.constructor('alert(1)')()}}
#   DOM sinks             — document.write, innerHTML, eval indicators
#
# Detection strategy:
#   Raw reflection    — unique probe token appears verbatim in response
#   Unescaped check   — < and > appear unescaped around the probe token
#   Attribute context — probe appears inside an HTML attribute value
#   Script context    — probe appears inside a <script> block
#
# Variables:
#   FUZZ_TARGET_URL   — Base URL of the target (required)
#   FUZZ_ENDPOINTS    — Space-separated list of paths to test
#   FUZZ_PARAM        — Parameter name to inject (default: q)
#   FUZZ_METHOD       — GET or POST (default: GET)
#   FUZZ_TIMEOUT      — Request timeout in seconds (default: 5)
#
# Usage:
#   include:
#     - project: homelab/components/fuzzing
#       ref: main
#       file: fuzz-xss.yml
#
#   xss-fuzz:
#     extends: .fuzz-xss
#     variables:
#       FUZZ_TARGET_URL: "http://banking-app:8080"
#       FUZZ_ENDPOINTS: "/search /profile-search"
#       FUZZ_PARAM: "query"

.fuzz-xss:
  stage: test
  image: harbor.home.lan/homelab/fuzz-runner:latest
  variables:
    FUZZ_TARGET_URL: "http://localhost:8080"
    FUZZ_ENDPOINTS: "/search /profile-search"
    FUZZ_PARAM: "query"
    FUZZ_METHOD: "GET"
    FUZZ_TIMEOUT: "5"
    NEXUS_REPORT_UPLOAD: "true"
    NEXUS_BIN_REPORTS_REPO: "fuzz-reports"
    NEXUS_URL: "https://nexus.home.lan"
  before_script:
  script:
    - |
      python3 << 'PYEOF'
      import json, os, re, time, urllib.parse, hashlib
      import urllib.request, urllib.error

      base_url  = os.environ.get("FUZZ_TARGET_URL", "http://localhost:8080").rstrip("/")
      endpoints = os.environ.get("FUZZ_ENDPOINTS", "/search").split()
      param     = os.environ.get("FUZZ_PARAM", "q")
      method    = os.environ.get("FUZZ_METHOD", "GET").upper()
      timeout   = int(os.environ.get("FUZZ_TIMEOUT", "5"))

      # Unique probe token embedded in every payload — if this appears unescaped
      # in the response body we know the parameter is reflected without encoding.
      PROBE = "XSS7f3a9b"

      PAYLOADS = [
          # Basic script injection
          ("basic_script", f"<script>{PROBE}alert(1)</script>"),
          ("basic_script", f"<SCRIPT>{PROBE}alert(1)</SCRIPT>"),
          ("basic_script", f"<script/>{PROBE}alert(1)"),
          # Attribute injection
          ("attr_inject", f'" onmouseover="{PROBE}alert(1)"'),
          ("attr_inject", f"' onmouseover='{PROBE}alert(1)'"),
          ("attr_inject", f'" autofocus onfocus="{PROBE}alert(1)"'),
          ("attr_inject", f"<img src=x onerror={PROBE}alert(1)>"),
          ("attr_inject", f"<img src=x onerror='{PROBE}alert(1)'>"),
          # HTML5 event handlers
          ("html5_event", f"<body onload={PROBE}alert(1)>"),
          ("html5_event", f"<svg onload={PROBE}alert(1)>"),
          ("html5_event", f"<video><source onerror={PROBE}alert(1)>"),
          ("html5_event", f"<details open ontoggle={PROBE}alert(1)>"),
          ("html5_event", f"<audio src=x onerror={PROBE}alert(1)>"),
          ("html5_event", f"<input autofocus onfocus={PROBE}alert(1)>"),
          # JavaScript URI
          ("js_uri", f"javascript:{PROBE}alert(1)"),
          ("js_uri", f"JaVaScRiPt:{PROBE}alert(1)"),
          ("js_uri", f"java&#x0A;script:{PROBE}alert(1)"),
          # URL encoded
          ("url_encoded", f"%3Cscript%3E{PROBE}alert%281%29%3C%2Fscript%3E"),
          ("url_encoded", f"%22%20onerror%3D%22{PROBE}alert(1)%22"),
          # Double encoded
          ("double_encoded", f"%253Cscript%253E{PROBE}alert%25281%2529%253C%252Fscript%253E"),
          # SVG
          ("svg", f'<svg xmlns="http://www.w3.org/2000/svg"><script>{PROBE}alert(1)</script></svg>'),
          ("svg", f"<svg><animate onbegin={PROBE}alert(1) attributeName=x dur=1s>"),
          # Filter bypass
          ("filter_bypass", f"<sCrIpT>{PROBE}alert(1)</sCrIpT>"),
          ("filter_bypass", f"<<script>{PROBE}alert(1)<</script>"),
          ("filter_bypass", f"<script >{PROBE}alert(1)</script >"),
          ("filter_bypass", f"`{PROBE}alert(1)`"),
          # Template injection (Angular/Vue)
          ("template_inject", f"{{{{constructor.constructor('{PROBE}alert(1)')()}}}}"),
          ("template_inject", f"${{'{PROBE}alert(1)'}}"),
          # Polyglots
          ("polyglot", f"javascript://'{PROBE}%0aalert(1)"),
          ("polyglot", f"\"><img src=x onerror={PROBE}alert(1)><\""),
      ]

      findings = []
      seen = set()

      def send(endpoint, payload):
          url = f"{base_url}{endpoint}"
          try:
              if method == "GET":
                  encoded = urllib.parse.quote(str(payload), safe="")
                  req = urllib.request.Request(
                      f"{url}?{param}={encoded}",
                      headers={"User-Agent": "Mozilla/5.0 FuzzBot/1.0"}
                  )
              else:
                  data = urllib.parse.urlencode({param: str(payload)}).encode()
                  req  = urllib.request.Request(url, data=data, headers={
                      "User-Agent": "Mozilla/5.0 FuzzBot/1.0",
                      "Content-Type": "application/x-www-form-urlencoded",
                  })
              try:
                  resp = urllib.request.urlopen(req, timeout=timeout)
                  body = resp.read().decode("utf-8", errors="replace")
                  status = resp.status
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  status = e.code
              return status, body
          except Exception:
              return None, ""

      for endpoint in endpoints:
          for category, payload in PAYLOADS:
              status, body = send(endpoint, payload)
              if status is None:
                  continue

              issues = []
              sev = "Low"

              # Primary detection: probe token reflected unescaped
              if PROBE in body:
                  issues.append(f"Probe token `{PROBE}` reflected in response body")
                  sev = "High"

                  # Check for unescaped angle brackets near probe
                  idx = body.find(PROBE)
                  context = body[max(0, idx-100):idx+100]
                  if "<" in context and ">" in context:
                      issues.append("Unescaped `<` and `>` found around probe — likely executable context")
                      sev = "Critical"

                  # Script context
                  if re.search(r'<script[^>]*>.*?' + re.escape(PROBE), body, re.S | re.I):
                      issues.append("Probe appears inside `<script>` block — direct JS execution context")
                      sev = "Critical"

                  # Attribute context
                  if re.search(r'(?:on\w+=|href=|src=)["\']?[^"\'<>]*' + re.escape(PROBE), body, re.I):
                      issues.append("Probe appears inside an HTML event handler or URL attribute")
                      sev = "Critical"

              # HTML-encoded check — detect partial encoding failures
              probe_lc = PROBE.lower()
              if probe_lc in body.lower() and PROBE not in body:
                  issues.append("Probe reflected with case change — possible partial filter")
                  if sev not in ("Critical", "High"):
                      sev = "Medium"

              if issues:
                  key = (endpoint, category)
                  if key in seen:
                      continue
                  seen.add(key)

                  short_payload = payload[:120] + ("..." if len(payload) > 120 else "")
                  findings.append({
                      "title":           f"[FUZZ-XSS] {category} — {endpoint}",
                      "severity":        sev,
                      "description":     (
                          f"**Endpoint:** `{base_url}{endpoint}`\n"
                          f"**Category:** {category}\n"
                          f"**Payload:** `{short_payload}`\n"
                          f"**Status:** {status}\n\n"
                          + "\n".join(f"- {i}" for i in issues)
                      ),
                      "mitigation":      (
                          "HTML-encode all user-supplied data before rendering in HTML context. "
                          "Use a Content Security Policy (CSP) to restrict script execution. "
                          "Prefer `th:text` over `th:utext` in Thymeleaf templates. "
                          "Validate and sanitize all inputs server-side."
                      ),
                      "static_finding":  False,
                      "dynamic_finding": True,
                  })

      json.dump({"findings": findings}, open("xss-findings.json", "w"), indent=2)

      with open("xss-report.md", "w") as f:
          f.write(f"# XSS Fuzz Report — {base_url}\n\n")
          f.write(f"**Endpoints:** {len(endpoints)}  |  **Payloads:** {len(PAYLOADS)}  |  **Findings:** {len(findings)}\n\n")
          f.write("| Severity | Category | Endpoint |\n|---|---|---|\n")
          for finding in findings:
              title = finding["title"].replace("[FUZZ-XSS] ", "")
              f.write(f"| {finding['severity']} | {title} |\n")

      print(f"fuzz-xss: {len(findings)} XSS indicators across {len(endpoints)} endpoints")
      PYEOF

    - |
      if [ "${NEXUS_REPORT_UPLOAD}" = "true" ]; then
        BASE="${CI_PROJECT_PATH_SLUG}/${CI_COMMIT_SHORT_SHA}/fuzz-xss"
        for f in xss-findings.json xss-report.md; do
          curl -sk -u "${NEXUS_USER}:${NEXUS_PASSWORD}" \
            -T "${f}" "${NEXUS_URL}/repository/${NEXUS_BIN_REPORTS_REPO}/${BASE}/${f}" \
            -w "Uploaded ${f}: HTTP %{http_code}\n" -o /dev/null
        done
      fi
  artifacts:
    name: "fuzz-xss-${CI_COMMIT_SHORT_SHA}"
    paths: [xss-findings.json, xss-report.md]
    when: always
    expire_in: 30 days
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
