# Input mutation and boundary fuzzing
#
# Sends a wide range of malformed, boundary, and adversarial inputs to HTTP
# endpoints and analyzes responses for crashes, errors, and unexpected behaviour.
#
# Test categories:
#   Boundary integers     — INT_MAX, INT_MIN, -1, 0, overflow values
#   String length bombs   — 1, 100, 1000, 10000, 100000 character strings
#   Format strings        — %s %n %x %p (segfault / info disclosure on C backends)
#   Null / control bytes  — \x00, \r\n injection, CRLF injection
#   Path traversal        — ../../../etc/passwd, URL-encoded variants
#   Template injection    — {{7*7}}, ${7*7}, <%= 7*7 %> (SSTI detection)
#   Command injection     — ; id, | whoami, `id`, $(id)
#   LDAP injection        — *, )(uid=*))(|(uid=*
#   XXE triggers          — <?xml version="1.0"?><!DOCTYPE ...>
#   JSON type confusion   — array instead of string, boolean instead of int
#   Unicode bombs         — overlong UTF-8, right-to-left override, BOM
#
# Variables:
#   FUZZ_TARGET_URL      — Base URL of the application (required)
#   FUZZ_ENDPOINTS       — Space-separated list of paths to fuzz (default: common auth paths)
#   FUZZ_PARAM           — Query/body parameter name to inject (default: q)
#   FUZZ_METHOD          — HTTP method to use: GET or POST (default: GET)
#   FUZZ_TIMEOUT         — Request timeout in seconds (default: 5)
#
# Usage:
#   include:
#     - project: homelab/components/fuzzing
#       ref: main
#       file: fuzz-input.yml
#
#   input-fuzz:
#     extends: .fuzz-input
#     variables:
#       FUZZ_TARGET_URL: "http://banking-app:8080"
#       FUZZ_ENDPOINTS: "/search /api/transfer /login"
#       FUZZ_PARAM: "query"

.fuzz-input:
  stage: test
  image: harbor.home.lan/homelab/fuzz-runner:latest
  variables:
    FUZZ_TARGET_URL: "http://localhost:8080"
    FUZZ_ENDPOINTS: "/search /login /api/transfer /api/xml/transfer"
    FUZZ_PARAM: "q"
    FUZZ_METHOD: "GET"
    FUZZ_TIMEOUT: "5"
    NEXUS_REPORT_UPLOAD: "true"
    NEXUS_BIN_REPORTS_REPO: "fuzz-reports"
    NEXUS_URL: "https://nexus.home.lan"
  before_script:
  script:
    - |
      python3 << 'PYEOF'
      import json, os, re, time, urllib.parse
      import urllib.request, urllib.error

      base_url  = os.environ.get("FUZZ_TARGET_URL", "http://localhost:8080").rstrip("/")
      endpoints = os.environ.get("FUZZ_ENDPOINTS", "/search").split()
      param     = os.environ.get("FUZZ_PARAM", "q")
      method    = os.environ.get("FUZZ_METHOD", "GET").upper()
      timeout   = int(os.environ.get("FUZZ_TIMEOUT", "5"))

      PAYLOADS = [
          # Boundary integers
          ("boundary_int", "0"),
          ("boundary_int", "-1"),
          ("boundary_int", "2147483647"),
          ("boundary_int", "2147483648"),
          ("boundary_int", "-2147483648"),
          ("boundary_int", "9999999999999999999"),
          # Long strings
          ("length_bomb", "A" * 100),
          ("length_bomb", "A" * 1000),
          ("length_bomb", "A" * 10000),
          ("length_bomb", "A" * 65536),
          # Format strings
          ("format_string", "%s%s%s%s%s%s%s%s"),
          ("format_string", "%n%n%n%n"),
          ("format_string", "%x%x%x%x%x%x%x%x"),
          ("format_string", "%p%p%p%p"),
          ("format_string", "%.99999d"),
          # Null / control bytes
          ("null_byte", "\x00"),
          ("null_byte", "test\x00admin"),
          ("null_byte", "test%00admin"),
          # CRLF injection
          ("crlf_injection", "value\r\nSet-Cookie: injected=1"),
          ("crlf_injection", "value%0d%0aSet-Cookie: injected=1"),
          # Path traversal
          ("path_traversal", "../../../etc/passwd"),
          ("path_traversal", "..%2F..%2F..%2Fetc%2Fpasswd"),
          ("path_traversal", "....//....//....//etc/passwd"),
          ("path_traversal", "..\\..\\..\\windows\\system32\\drivers\\etc\\hosts"),
          ("path_traversal", "%2e%2e%2f%2e%2e%2f%2e%2e%2fetc%2fpasswd"),
          # Template injection (SSTI)
          ("ssti", "{{7*7}}"),
          ("ssti", "${7*7}"),
          ("ssti", "<%= 7*7 %>"),
          ("ssti", "{{config}}"),
          ("ssti", "#{7*7}"),
          ("ssti", "*{7*7}"),
          # Command injection
          ("cmd_injection", "; id"),
          ("cmd_injection", "| id"),
          ("cmd_injection", "`id`"),
          ("cmd_injection", "$(id)"),
          ("cmd_injection", "; ls -la /"),
          ("cmd_injection", "|| ping -c 1 127.0.0.1"),
          ("cmd_injection", "& whoami"),
          # LDAP injection
          ("ldap_injection", "*"),
          ("ldap_injection", "*(uid=*))(|(uid=*"),
          ("ldap_injection", "admin)(|(password=*)"),
          # XXE
          ("xxe", '<?xml version="1.0"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM "file:///etc/passwd">]><foo>&xxe;</foo>'),
          ("xxe", '<?xml version="1.0"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM "http://169.254.169.254/latest/meta-data/">]><foo>&xxe;</foo>'),
          # JSON type confusion
          ("json_type_confusion", '{"user": ["admin"]}'),
          ("json_type_confusion", '{"amount": "1e999"}'),
          ("json_type_confusion", '{"enabled": "true"}'),
          ("json_type_confusion", 'null'),
          ("json_type_confusion", '[]'),
          # Unicode
          ("unicode", "‮‭"),
          ("unicode", "﻿"),
          ("unicode", "\xc0\xae\xc0\xae"),
          ("unicode", "\ud800"),
      ]

      ERROR_PATTERNS = [
          (r'exception|stacktrace|stack trace|at [a-z]+\.[a-z]+\.', "Stack trace in response", "High"),
          (r'sql syntax|mysql_|ORA-\d{5}|pg_query|sqlite_', "SQL error message", "Critical"),
          (r'root:.*:/bin/', "Passwd file contents", "Critical"),
          (r'\b49\b', "SSTI 7*7=49 evaluated", "Critical"),
          (r'uid=\d+\(', "Command injection — id output", "Critical"),
          (r'java\.lang\.|javax\.|org\.springframework\.', "Java exception class", "High"),
          (r'set-cookie.*injected', "CRLF injection — header injected", "High"),
          (r'nginx|apache|iis|tomcat|jetty|weblogic', "Server banner disclosure", "Low"),
      ]

      findings  = []
      seen      = set()

      def send(endpoint, payload, category):
          url = f"{base_url}{endpoint}"
          try:
              if method == "GET":
                  encoded = urllib.parse.quote(str(payload), safe="")
                  full_url = f"{url}?{param}={encoded}"
                  req = urllib.request.Request(full_url, headers={"User-Agent": "FuzzBot/1.0"})
                  resp = urllib.request.urlopen(req, timeout=timeout)
                  body = resp.read().decode("utf-8", errors="replace")
                  status = resp.status
              else:
                  data = urllib.parse.urlencode({param: str(payload)}).encode()
                  req  = urllib.request.Request(url, data=data, headers={
                      "User-Agent": "FuzzBot/1.0",
                      "Content-Type": "application/x-www-form-urlencoded",
                  })
                  try:
                      resp = urllib.request.urlopen(req, timeout=timeout)
                      body = resp.read().decode("utf-8", errors="replace")
                      status = resp.status
                  except urllib.error.HTTPError as e:
                      body = e.read().decode("utf-8", errors="replace")
                      status = e.code
              return status, body
          except urllib.error.HTTPError as e:
              try:
                  body = e.read().decode("utf-8", errors="replace")
              except Exception:
                  body = ""
              return e.code, body
          except Exception:
              return None, ""

      for endpoint in endpoints:
          for category, payload in PAYLOADS:
              status, body = send(endpoint, payload, category)
              if status is None:
                  continue

              trigger_500 = status == 500
              matched_patterns = []
              for pattern, desc, sev in ERROR_PATTERNS:
                  if re.search(pattern, body, re.I):
                      matched_patterns.append((desc, sev))

              if trigger_500 or matched_patterns:
                  key = (endpoint, category, status)
                  if key in seen:
                      continue
                  seen.add(key)

                  sev = "Medium"
                  details = []
                  if trigger_500:
                      details.append("Server returned HTTP 500.")
                      sev = max(sev, "High", key=lambda s: ["Low","Info","Medium","High","Critical"].index(s))
                  for desc, psev in matched_patterns:
                      details.append(f"Pattern match: **{desc}**")
                      if ["Low","Info","Medium","High","Critical"].index(psev) > ["Low","Info","Medium","High","Critical"].index(sev):
                          sev = psev

                  short_payload = repr(payload[:80]) + ("..." if len(payload) > 80 else "")
                  findings.append({
                      "title":           f"[FUZZ-INPUT] {category} — {endpoint} ({status})",
                      "severity":        sev,
                      "description":     (
                          f"**Endpoint:** `{base_url}{endpoint}`\n"
                          f"**Category:** {category}\n"
                          f"**Payload:** `{short_payload}`\n"
                          f"**Status:** {status}\n\n"
                          + "\n".join(details)
                      ),
                      "mitigation":      "Implement strict server-side input validation. Sanitize all user input before processing. Return generic error messages to clients.",
                      "static_finding":  False,
                      "dynamic_finding": True,
                  })

      json.dump({"findings": findings}, open("input-findings.json", "w"), indent=2)

      with open("input-report.md", "w") as f:
          f.write(f"# Input Mutation Fuzz Report — {base_url}\n\n")
          f.write(f"**Endpoints:** {len(endpoints)}  |  **Payload categories:** {len(set(c for c,_ in PAYLOADS))}  |  **Findings:** {len(findings)}\n\n")
          f.write("| Severity | Category | Endpoint | Status |\n|---|---|---|---|\n")
          for finding in findings:
              title = finding["title"].replace("[FUZZ-INPUT] ", "")
              f.write(f"| {finding['severity']} | {title} |\n")

      print(f"fuzz-input: {len(findings)} anomalies across {len(endpoints)} endpoints")
      PYEOF

    - |
      if [ "${NEXUS_REPORT_UPLOAD}" = "true" ]; then
        BASE="${CI_PROJECT_PATH_SLUG}/${CI_COMMIT_SHORT_SHA}/fuzz-input"
        for f in input-findings.json input-report.md; do
          curl -sk -u "${NEXUS_USER}:${NEXUS_PASSWORD}" \
            -T "${f}" "${NEXUS_URL}/repository/${NEXUS_BIN_REPORTS_REPO}/${BASE}/${f}" \
            -w "Uploaded ${f}: HTTP %{http_code}\n" -o /dev/null
        done
      fi
  artifacts:
    name: "fuzz-input-${CI_COMMIT_SHORT_SHA}"
    paths: [input-findings.json, input-report.md]
    when: always
    expire_in: 30 days
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
