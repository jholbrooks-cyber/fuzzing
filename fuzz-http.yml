# HTTP endpoint and directory fuzzing
#
# Discovers hidden endpoints, directories, backup files, and admin panels
# by brute-forcing paths against a target HTTP server. Analyses responses
# to classify findings by status code and content patterns.
#
# What it finds:
#   Exposed admin panels     — /admin, /console, /manager, /phpmyadmin
#   Backup / source files    — .bak, .old, .orig, ~, .git, .env
#   API endpoint discovery   — /api/v1, /api/v2, /graphql, /swagger
#   Debug endpoints          — /actuator, /debug, /trace, /health
#   Sensitive files          — /robots.txt, /sitemap.xml, /.well-known
#   Directory listings       — responses containing "Index of /"
#
# Variables:
#   FUZZ_TARGET_URL     — Base URL to fuzz (required), e.g. http://app:8080
#   FUZZ_THREADS        — Parallel request threads (default: 10)
#   FUZZ_TIMEOUT        — Request timeout in seconds (default: 5)
#   FUZZ_STATUS_FILTER  — Comma-separated status codes to report (default: 200,201,301,302,403,500)
#
# Usage:
#   include:
#     - project: homelab/components/fuzzing
#       ref: main
#       file: fuzz-http.yml
#
#   http-fuzz:
#     extends: .fuzz-http
#     variables:
#       FUZZ_TARGET_URL: "http://banking-app:8080"

.fuzz-http:
  stage: test
  image: python:3.12-slim
  variables:
    FUZZ_TARGET_URL: "http://localhost:8080"
    FUZZ_THREADS: "10"
    FUZZ_TIMEOUT: "5"
    FUZZ_STATUS_FILTER: "200,201,301,302,403,500"
    NEXUS_REPORT_UPLOAD: "true"
    NEXUS_BIN_REPORTS_REPO: "fuzz-reports"
    NEXUS_URL: "https://nexus.home.lan"
  before_script:
    - pip install --quiet requests
  script:
    - |
      python3 << 'PYEOF'
      import json, os, re, time
      from concurrent.futures import ThreadPoolExecutor, as_completed
      import urllib.request, urllib.error

      base_url  = os.environ.get("FUZZ_TARGET_URL", "http://localhost:8080").rstrip("/")
      threads   = int(os.environ.get("FUZZ_THREADS", "10"))
      timeout   = int(os.environ.get("FUZZ_TIMEOUT", "5"))
      status_filter = set(int(s) for s in os.environ.get("FUZZ_STATUS_FILTER", "200,201,301,302,403,500").split(","))

      WORDLIST = [
          # Admin / management
          "admin", "administrator", "admin.php", "admin.html", "admin/login",
          "manager", "management", "dashboard", "panel", "control",
          "console", "phpmyadmin", "phpMyAdmin", "wp-admin", "wp-login.php",
          # API
          "api", "api/v1", "api/v2", "api/v3", "graphql", "graphiql",
          "swagger", "swagger-ui.html", "swagger-ui", "api-docs", "openapi.json",
          "openapi.yaml", "v1", "v2",
          # Spring Boot actuator / debug
          "actuator", "actuator/health", "actuator/env", "actuator/mappings",
          "actuator/beans", "actuator/metrics", "actuator/loggers",
          "actuator/heapdump", "actuator/threaddump", "actuator/httptrace",
          "actuator/info", "actuator/configprops",
          "health", "info", "metrics", "debug", "trace", "env",
          # Sensitive files
          ".env", ".env.local", ".env.production", ".env.backup",
          ".git", ".git/config", ".git/HEAD",
          ".htaccess", ".htpasswd",
          "web.config", "Web.config",
          "config.php", "config.yml", "config.yaml", "config.json",
          "settings.py", "settings.php",
          "database.yml", "database.json",
          "wp-config.php", "configuration.php",
          # Backup / source
          "backup", "backup.zip", "backup.tar.gz", "backup.sql",
          "index.php.bak", "index.html.bak", "index.bak",
          "site.zip", "www.zip", "source.zip",
          "dump.sql", "db.sql", "database.sql",
          # Logs
          "log", "logs", "error.log", "access.log", "debug.log",
          "application.log", "server.log",
          # Common paths
          "login", "logout", "register", "signup", "signin",
          "profile", "account", "user", "users",
          "upload", "uploads", "files", "file",
          "download", "downloads",
          "search", "query",
          "test", "testing", "dev", "development", "staging",
          "old", "old_site", "backup_old",
          # Robots / well-known
          "robots.txt", "sitemap.xml", "sitemap.txt",
          ".well-known/security.txt",
          "security.txt",
          "CHANGELOG", "CHANGELOG.md", "README.md",
          "LICENSE", "VERSION",
          # Shell / cgi
          "cgi-bin", "cgi-bin/admin.cgi", "shell.php", "cmd.php",
          "c99.php", "r57.php", "webshell.php",
      ]

      findings  = []
      hit_paths = []

      def probe(path):
          url = f"{base_url}/{path}"
          try:
              req = urllib.request.Request(url, headers={"User-Agent": "FuzzBot/1.0"})
              resp = urllib.request.urlopen(req, timeout=timeout)
              return path, resp.status, len(resp.read()), None
          except urllib.error.HTTPError as e:
              return path, e.code, 0, None
          except Exception as ex:
              return path, None, 0, str(ex)

      def classify(path, status, size):
          sev, detail = "Low", ""
          if status == 200:
              if any(x in path for x in ["actuator", "heapdump", "threaddump", "env", "configprops"]):
                  sev = "Critical"
                  detail = "Spring Boot Actuator endpoint exposed — may leak environment variables, heap dumps, or thread state."
              elif any(x in path for x in [".env", ".git", "config", "database", ".htpasswd", "wp-config"]):
                  sev = "High"
                  detail = "Sensitive configuration file accessible without authentication."
              elif any(x in path for x in ["admin", "manager", "console", "phpmyadmin", "dashboard"]):
                  sev = "High"
                  detail = "Admin panel or management interface is reachable."
              elif any(x in path for x in ["backup", ".bak", ".sql", ".zip", ".tar"]):
                  sev = "High"
                  detail = "Backup or archive file accessible — may contain source code or database dump."
              elif any(x in path for x in ["shell", "cmd.php", "c99", "r57", "webshell"]):
                  sev = "Critical"
                  detail = "Possible web shell detected."
              elif any(x in path for x in ["log", "error.log", "access.log"]):
                  sev = "Medium"
                  detail = "Log file accessible — may contain sensitive request data or stack traces."
              else:
                  sev = "Low"
                  detail = "Endpoint returned 200 OK."
          elif status == 403:
              sev = "Info"
              detail = "Resource exists but access is forbidden — may be bypassable."
          elif status == 500:
              sev = "Medium"
              detail = "Server error on probe — may indicate an unhandled path or crash."
          elif status in (301, 302):
              sev = "Info"
              detail = "Redirect detected — following may expose additional content."
          return sev, detail

      with ThreadPoolExecutor(max_workers=threads) as pool:
          futures = {pool.submit(probe, p): p for p in WORDLIST}
          for fut in as_completed(futures):
              path, status, size, err = fut.result()
              if status in status_filter:
                  sev, detail = classify(path, status, size)
                  hit_paths.append((path, status, size, sev))
                  findings.append({
                      "title":           f"[FUZZ-HTTP] HTTP {status} — /{path}",
                      "severity":        sev,
                      "description":     (
                          f"**URL:** `{base_url}/{path}`\n"
                          f"**Status:** {status}  |  **Response size:** {size} bytes\n\n"
                          f"{detail}"
                      ),
                      "mitigation":      "Verify endpoint is intentionally public. If not, restrict access via firewall rule or authentication gate.",
                      "static_finding":  False,
                      "dynamic_finding": True,
                  })

      hit_paths.sort(key=lambda x: (x[3], x[1]))

      json.dump({"findings": findings}, open("http-findings.json", "w"), indent=2)

      with open("http-report.md", "w") as f:
          f.write(f"# HTTP Fuzz Report — {base_url}\n\n")
          f.write(f"**Paths probed:** {len(WORDLIST)}  |  **Hits:** {len(hit_paths)}\n\n")
          f.write("| Status | Severity | Path | Size |\n|---|---|---|---|\n")
          for path, status, size, sev in hit_paths:
              f.write(f"| {status} | {sev} | `/{path}` | {size} |\n")

      print(f"fuzz-http: {len(hit_paths)} hits from {len(WORDLIST)} probes against {base_url}")
      PYEOF

    - |
      if [ "${NEXUS_REPORT_UPLOAD}" = "true" ]; then
        BASE="${CI_PROJECT_PATH_SLUG}/${CI_COMMIT_SHORT_SHA}/fuzz-http"
        for f in http-findings.json http-report.md; do
          curl -sk -u "${NEXUS_USER}:${NEXUS_PASSWORD}" \
            -T "${f}" "${NEXUS_URL}/repository/${NEXUS_BIN_REPORTS_REPO}/${BASE}/${f}" \
            -w "Uploaded ${f}: HTTP %{http_code}\n" -o /dev/null
        done
      fi
  artifacts:
    name: "fuzz-http-${CI_COMMIT_SHORT_SHA}"
    paths: [http-findings.json, http-report.md]
    when: always
    expire_in: 30 days
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
